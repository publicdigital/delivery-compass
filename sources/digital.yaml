- id: secure-by-design
  title: Secure by design
  # Not GDS, as the go-live plan expected: the framework's own About page says it "has
  # been developed by the Government Cyber Unit (GCU)", with GSG, NCSC and industry
  # (checked 2026-10-15). The page moved to /policy-and-guidance/secure-by-design/.
  body: Government Cyber Unit
  spine: digital
  authority: mandatory
  # NOT /government/collections/secure-by-design - that GOV.UK collection is DSIT's
  # unrelated consumer-IoT product security regime (PSTI Act, smart devices). Verified
  # 2026-08-21 by checking what the AI Playbook's own "Secure by Design" link actually
  # points to: https://www.security.gov.uk/guidance/secure-by-design/, off GOV.UK
  # entirely, and CloudFront returns 403 to non-browser requests, so it cannot be
  # fetched. Kept registered, off_platform, so the gap is visible rather than a
  # plausible-looking wrong answer sitting silently in the corpus.
  fetcher: off_platform
  not_indexed_reason: >-
    Published on the Secure by Design site (security.gov.uk), not GOV.UK, and that
    site blocks automated access. Linked, not reproduced.
  external_attachment: https://www.security.gov.uk/policy-and-guidance/secure-by-design/
  licence: OGL-v3

