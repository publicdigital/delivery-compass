# Hand-curated semantic edges between sources.
#
# This file is the "how it all fits together" layer. GOV.UK models documents, not
# the relationships between them, so nothing here can be derived automatically.
# Every edge is a curation judgement and should carry an `evidence` line quoting or
# citing what justifies it.
#
# Edge types:
#   requires      A cannot be satisfied without doing B
#   feeds         A produces an input that B consumes
#   assured_by    A is checked by the process in B
#   gates         A is an approval gate that B must pass
#   supersedes    A replaces B, wholly or on a specific point
#   conflicts     A and B give incompatible instructions on the same point
#   elaborates    A is supplementary detail on B

relations:
  # --- The supersession that matters most right now -------------------------
  # Digital and technology spend controls were replaced on 2026-04-01. The Service
  # Manual reflects this; the Technology Code of Practice has not been updated and
  # still instructs readers to follow the Cabinet Office spend control process and
  # contact the GDS Assurance team. Anyone reading TCoP alone gets stale process.
  - from: spend-controls
    to: tcop
    type: supersedes
    scope: spend control process
    effective: 2026-04-01
    severity: high
    evidence: >-
      Service Manual (updated 2026-04-01): "Digital and technology spend controls were
      replaced on 1 April 2026. From this date, central government departments are
      responsible for making most of their own digital and technology spending decisions."
      TCoP (updated 2025-07-07) still says: "You must consider all points of the TCoP as
      part of the Cabinet Office spend control process."
    guidance: >-
      Treat the Service Manual as current on who approves digital spend. TCoP remains
      current on the technology standards themselves, only its spend control section is stale.

  - from: spend-controls
    to: agile-business-case
    type: conflicts
    scope: digital service assessment and spend approval thresholds
    severity: medium
    evidence: >-
      The agile business case clarification (2024-08-28) refers to CDDO-led assessments
      and the pre-2026 spend control thresholds.
    guidance: Check current thresholds in the Service Manual before relying on the £10m figure.

  # --- Funding and appraisal spine ------------------------------------------
  - from: business-cases
    to: green-book
    type: requires
    scope: five case model appraisal
    evidence: Better Business Cases implements the appraisal method set out in the Green Book.

  - from: tap
    to: business-cases
    type: gates
    scope: HM Treasury approval of programmes and projects
    evidence: TAP sets out when Treasury approval of a business case is required.

  - from: green-book
    to: magenta-book
    type: feeds
    scope: appraisal to evaluation
    evidence: >-
      The Green Book covers appraisal (before) and the Magenta Book covers evaluation
      (during and after). They are two halves of the same ROAMEF cycle.

  - from: green-book-health
    to: green-book
    type: elaborates
    scope: health and wellbeing valuation

  - from: green-book-environment
    to: green-book
    type: elaborates
    scope: climate change and environmental valuation

  - from: green-book-mcda
    to: green-book
    type: elaborates
    scope: multi-criteria decision analysis in options appraisal

  - from: teal-book
    to: govs-002
    type: elaborates
    scope: how to direct and manage portfolios, programmes and projects
    evidence: >-
      The Teal Book home page (2026-10-15): "The Teal Book builds on the expectations of
      the Government Functional Standard for Project Delivery and serves as the core and
      definitive reference on how project delivery should be done in government."

  - from: publishing-business-cases
    to: business-cases
    type: elaborates
    scope: transparency requirements for publishing business cases

  - from: digital-data-benefits
    to: green-book
    type: elaborates
    scope: valuing digital and data benefits
    evidence: Added to the Green Book supplementary guidance collection on 2026-04-07.

  - from: agile-business-case
    to: business-cases
    type: elaborates
    scope: applying the five case model to agile digital delivery

  # --- Assurance spine ------------------------------------------------------
  - from: govs-002
    to: business-cases
    type: requires
    scope: project delivery standard mandates business case discipline

  - from: nista-assurance-toolkit
    to: govs-002
    type: assured_by
    scope: integrated assurance of the functional standard

  - from: gate-review-1
    to: business-cases
    type: gates
    scope: business justification (SOC/OBC)
  - from: gate-review-3
    to: tap
    type: gates
    scope: investment decision aligns with Treasury approval
  - from: gate-review-5
    to: magenta-book
    type: feeds
    scope: benefits realisation feeds evaluation

  - from: agile-assurance
    to: service-standard
    type: elaborates
    scope: how assurance reviews work for agile digital delivery
    evidence: The bridge between the NISTA assurance spine and the GDS digital spine.

  # --- Digital spine --------------------------------------------------------
  - from: service-standard
    to: service-manual
    type: elaborates
    scope: the manual explains how to meet the standard

  - from: service-standard
    to: accessibility-regs
    type: requires
    scope: accessibility
    evidence: >-
      Service Standard point 5 requires an accessible service; the accessibility
      regulations make this a statutory duty, not merely a standard.

  - from: tcop
    to: secure-by-design
    type: requires
    scope: security
  - from: ai-playbook
    to: data-ethics
    type: requires
    scope: ethical use of AI and data

  # --- Risk spine -----------------------------------------------------------
  - from: govs-002
    to: orange-book
    type: requires
    scope: risk management
    evidence: GovS 002 requires risk management consistent with the Orange Book.

  # Withdrawn sources kept as edges so anyone holding a copy is warned.
  - from: orange-book
    to: portfolio-risk-annex
    type: supersedes
    scope: portfolio risk management
    effective: 2026-07-29
    severity: high
    evidence: >-
      Deleted from GOV.UK on 2026-07-29 as "out of date, contained links to superseded
      guidance and no longer fully reflect the current Risk Centre of Excellence thinking".
    guidance: No public replacement. Current material sits on the OneFinance intranet.

  - from: orange-book
    to: risk-reporting-guide
    type: supersedes
    scope: risk reporting
    effective: 2026-07-29
    severity: high
    evidence: Deleted from GOV.UK on 2026-07-29 alongside the portfolio risk annex.
    guidance: No public replacement. Current material sits on the OneFinance intranet.

  # --- Evaluation spine -----------------------------------------------------
  - from: magenta-book
    to: green-book
    type: feeds
    scope: evaluation findings inform future appraisal

  # --- Oversight ------------------------------------------------------------
  - from: nista-annual-report
    to: govs-002
    type: assured_by
    scope: delivery confidence assessment of the major projects portfolio

  # --- Added in go-live WP4 (2026-10-15) ------------------------------------
  # Under Oli's decision D10 (docs/go-live-plan.md): edges the source text states
  # outright are added here with the quote; judgement calls are proposed in
  # docs/wp4-proposed-relationships.md and wait for Oli.

  # Gates 0, 2 and 4, following the pattern of Gates 1, 3 and 5.
  - from: gate-review-0
    to: business-cases
    type: gates
    scope: programme business case approval points
    evidence: >-
      Business case guidance (2026), 5.8: "There is only a single Gate for PBCs, which is
      Gate Review 0." 5.10: "Practitioners should undertake a Gate 0 Review when the PBC
      is first completed, ahead of the first approval point for the programme."

  - from: gate-review-2
    to: business-cases
    type: gates
    scope: Outline Business Case (OBC) approval
    evidence: >-
      Business case guidance (2026), Table 2: "Gate 2: Delivery Strategy. Prior to
      Outline Business Case (OBC) approval." Gate 2 workbook: "Confirm the Outline
      Business Case (OBC) now the project is fully defined".

  - from: gate-review-4
    to: business-cases
    type: requires
    scope: an approved Full Business Case before going live
    evidence: >-
      Gate 4 workbook, evidence expected: "The Project and HMT have been in dialogue
      about the full business case and HMT and both the Department Finance Director and
      HMT have signed off the FBC."

  - from: gate-review-4
    to: magenta-book
    type: requires
    scope: an approved evaluation plan
    evidence: >-
      Gate 4 workbook, project documentation: "A Magenta Book compliant Evaluation Plan
      approved by the Department Investment Committee and HMT if appropriate."

  # GovS 005: Digital.
  - from: govs-005
    to: service-standard
    type: requires
    scope: designing and running services
    evidence: >-
      GovS 005 v2.2, 5.3: "Services shall be delivered in accordance with the Service
      Standard."

  - from: tcop
    to: govs-005
    type: elaborates
    scope: expectations for technology decisions
    evidence: >-
      GovS 005 v2.2, 1.3: "This standard is supported by The Service Standard, which sets
      expectations for services, and the Technology Code of Practice, which sets
      expectations for technology decisions."

  # The commercial playbooks.
  - from: ddat-playbook
    to: tcop
    type: requires
    scope: technology design and data sharing in DDaT procurement
    evidence: >-
      DDaT Playbook (2023), Key policies: data should be shared using APIs which
      "satisfy the requirements of the Technology Code of Practice (TCoP)". Governance and
      approvals: "TCoP is a cross-government standard setting out the key considerations
      for how the government should design, build and buy technology."

  - from: ddat-playbook
    to: service-standard
    type: requires
    scope: service assessments for DDaT services
    evidence: >-
      DDaT Playbook (2023), DDaT assurance: "services will also need to meet the
      Government Service Standard".

  - from: ddat-playbook
    to: sourcing-playbook
    type: elaborates
    scope: sourcing and contracting for digital, data and technology
    evidence: >-
      DDaT Playbook: "The Digital, Data and Technology Playbook is part of a wider
      portfolio of Sourcing Playbooks developed by the Cabinet Office." Sourcing Playbook:
      "The DDaT Playbook provides guidance when sourcing and contracting for these
      digital services."

  - from: consultancy-playbook
    to: sourcing-playbook
    type: elaborates
    scope: sourcing consultancy services
    evidence: >-
      Consultancy Playbook v1.1, Scope: "The Consultancy Playbook forms part of the
      Sourcing Playbook. As such, the principles, guidelines and rules of the Sourcing
      Playbook still apply and shall be considered alongside the Consultancy Playbook
      where appropriate."

  # NISTA's integrated assurance guide.
  - from: integrated-assurance
    to: tap
    type: feeds
    scope: Integrated Assurance and Approval Plans submitted for Treasury approval
    evidence: >-
      Integrated assurance guide v2.1: the initial IAAP should be "validated by NISTA and
      HM Treasury, in sufficient time for appropriate planned assurance to take place
      prior to submission of a Strategic Outline Business Case (SOBC) to HM Treasury for
      approval." "The process for submission of IAAPs is described in the Treasury
      Approvals Process for projects and programmes".
