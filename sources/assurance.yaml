# Assurance and project delivery spine.
# NOTE: the Infrastructure and Projects Authority was replaced by NISTA (National
# Infrastructure and Service Transformation Authority) on 2025-04-01. The IPA
# organisation page has not been updated since. Registry uses NISTA as the owning body.
# The standard (v2.1, 1 September 2025) is public on projectdelivery.gov.uk, but only
# through its "Download" link, which answers scripts with a Cloudflare challenge; the
# direct /wp-content/uploads/ file returns 404 even to a browser (checked 2026-10-15).
# We do not get round the challenge. So it is read from a copy Oli downloaded on
# 2026-10-15, committed to data/snapshots/ (fetcher snapshot_pdf). It does not update
# itself: the GOV.UK landing page is still watched, and a new version there raises the
# weekly curator issue. Oli has asked Government Project Delivery for a link a script
# can fetch, as they already provide for the Teal Book. Two columns, no PDF outline:
# headings come from type size, and the HTML edition carries the same headings, so
# citations link to each one there.
- id: govs-002
  title: "Government Functional Standard GovS 002: Project Delivery"
  body: Government Project Delivery
  spine: assurance
  authority: mandatory
  fetcher: snapshot_pdf
  slug: /government/publications/project-delivery-functional-standard
  endpoint: https://projectdelivery.gov.uk/library-products/government-functional-standard-govs-002-project-delivery/
  snapshot:
    file: data/snapshots/govs-002-v2.1.pdf
    version: "2.1"
    taken: "2026-10-15"
    text_fragments: true
  licence: OGL-v3
  # Same shall/should/may convention as the Orange Book.
  declares_convention: true
  # The library page with the publisher's Download link.
  external_attachment: https://projectdelivery.gov.uk/library-product/government-functional-standard-govs-002-project-delivery/

# The standard's continuous improvement assessment framework (v2.1, August 2025).
# Same route and reasons as govs-002. No HTML edition, so citations go to its library
# page.
- id: govs-002-ciaf
  title: "GovS 002 continuous improvement assessment framework"
  body: Government Project Delivery
  spine: assurance
  authority: advisory
  fetcher: snapshot_pdf
  slug: /government/publications/project-delivery-functional-standard
  endpoint: https://projectdelivery.gov.uk/library-product/continuous-improvement-assessment-framework/
  snapshot:
    file: data/snapshots/govs-002-ciaf-v2.1.pdf
    version: "2.1"
    taken: "2026-10-15"
    text_fragments: false
  licence: OGL-v3

# The Teal Book: Government Project Delivery's "core and definitive reference on how
# project delivery should be done in government", building on GovS 002. Version 3.0,
# 2026-07-01. Not on GOV.UK. Its web pages answer non-browser requests with a
# Cloudflare challenge, which we do not get round; the publisher also serves the whole
# book as a PDF regenerated nightly from those pages, and that is what is read.
# Citations go to the chapter pages. See pipeline/fetchers/projectdelivery.ts.
- id: teal-book
  title: "The Teal Book: Project delivery in government"
  body: Government Project Delivery
  spine: assurance
  authority: advisory
  fetcher: projectdelivery_pdf
  endpoint: https://projectdelivery.gov.uk/teal-book/home/
  pdf: https://projectdelivery.gov.uk/wp-content/uploads/teal_book/The-Teal-Book-daily-generated.pdf
  licence: OGL-v3

