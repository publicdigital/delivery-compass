<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Feedback sent: Gov Delivery Library</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="/trial/pd.css">
  <link rel="stylesheet" href="/trial/trial.css">
</head>
<body>
  <header class="pd-header">
    <div class="pd-width-container pd-header__container">
      <a href="/trial/" class="pd-header__title">Gov Delivery Library</a>
      <a href="https://public.digital/" class="pd-header__maker"><span>An experiment by</span><img src="/trial/brand/public-digital-wordmark-white.png" alt="Public Digital" width="127" height="22"></a>
    </div>
  </header>
  <div class="pd-width-container">
    <main class="pd-main-wrapper" id="main-content">
      <div class="pd-grid-row">
        <div class="pd-grid-column-two-thirds">
          <div class="pd-panel pd-panel--confirmation">
            <h1 class="pd-panel__title">Feedback sent</h1>
            <div class="pd-panel__body">Thank you</div>
          </div>
          <p class="pd-body">We read every response. If you left an email address and asked a question, we will reply.</p>
          <p class="pd-body"><a class="pd-link" href="/trial/">Back to the Gov Delivery Library</a></p>
        </div>
      </div>
    </main>
  </div>
