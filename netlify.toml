# Netlify configuration.
#
# There is no [build] section on purpose. The org deploy workflow runs
# `netlify deploy --prod --dir=.` with no build step, so the repo is published
# as-is. That is why assets/data/*.json is committed rather than generated in CI:
# refreshing the corpus means committing new JSON. .github/workflows/refresh.yml
# does that weekly; `npm run refresh` then commit and push does it by hand.

# Registered here rather than via inline `export const config`, which a bare
# `netlify deploy` silently treats as a plain static asset. Covers /* so the
# password also applies to the form endpoint, not just the pages.
[[edge_functions]]
  function = "basic-auth"
  path = "/*"

# The app has no inline scripts or styles, so the CSP can forbid both outright
# rather than relying on nonces (which needed a server to generate them).
# connect-src and form-action stay 'self': the only thing leaving the browser is
# a feedback post back to this same origin.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; font-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"

# The corpus is a build artefact refreshed by redeploy, so it may be cached hard
# within a visit but must not be served stale after one.
[[headers]]
  for = "/assets/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# `netlify deploy --dir=.` publishes the whole repo, so the pipeline source, the
# registry YAML and the handover docs would otherwise be fetchable by anyone holding
# the password. Nothing secret lives there, but testers should meet the prototype, not
# its source tree. These only block HTTP access; the files are still uploaded.
#
# force = true is required: without it Netlify serves an existing static file in
# preference to a redirect rule, so these returned 200 on the first deploy.
[[redirects]]
  from = "/pipeline/*"
  to = "/index.html"
  status = 404
  force = true
[[redirects]]
  from = "/sources/*"
  to = "/index.html"
  status = 404
  force = true
[[redirects]]
  from = "/test/*"
  to = "/index.html"
  status = 404
  force = true
[[redirects]]
  from = "/scripts/*"
  to = "/index.html"
  status = 404
  force = true
[[redirects]]
  from = "/docs/*"
  to = "/index.html"
  status = 404
  force = true

# Netlify injects its own HUD widget script into every page, which then applies
# inline styles and scripts that this CSP blocks - four red console errors that are
# Netlify's, not the app's. Attempting to block it with a redirect does NOT work:
# /.netlify/* is reserved and routed before redirect rules are consulted. Left alone
# deliberately. Relaxing the CSP to silence it would be the wrong trade, and nothing
# in the app depends on it. If it ever matters, it is a Netlify site setting, not
# something fixable from this repo.

# Working notes, not part of the prototype. Listed individually: Netlify only
# supports a trailing splat, so "/*.md" matches nothing and fails silently.
[[redirects]]
  from = "/HANDOVER.md"
  to = "/index.html"
  status = 404
  force = true
[[redirects]]
  from = "/CLAUDE.md"
  to = "/index.html"
  status = 404
  force = true
[[redirects]]
  from = "/DEPLOY.md"
  to = "/index.html"
  status = 404
  force = true
[[redirects]]
  from = "/README.md"
  to = "/index.html"
  status = 404
  force = true
